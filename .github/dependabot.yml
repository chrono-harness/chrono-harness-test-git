version: 2
updates:
  - directory: /
    groups:
      github-actions:
        patterns:
        - '*'
    package-ecosystem: github-actions
    schedule:
      interval: daily
    target-branch: dev
  - directories:
    - /crates/test-git
    - /crates/test-git-tests
    groups:
      cargo:
        patterns:
        - '*'
    package-ecosystem: cargo
    schedule:
      interval: daily
    target-branch: dev
