name: Release chrono-test-git
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release branch
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/tag-check.XXXXXXXX")
          trap 'rm -rf -- "$directory"' EXIT
          curl --fail --silent --show-error --location \
            'https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.2/chrono-host-release-linux-x86_64' \
            --output "$directory/chrono-host-release"
          (cd "$directory" && echo '011526545e7cd1fb9b3e8d3fc50630de3b6f40b7c6ed5cd53c14df9cbbb53e10  chrono-host-release' | sha256sum --check --status)
          chmod 700 "$directory/chrono-host-release"
          "$directory/chrono-host-release" check-pushed-tag "$GITHUB_REF_NAME"
  build:
    needs: source
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and exercise the release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path crates/test-git/Cargo.toml
          test "$("$CARGO_TARGET_DIR/release/chrono-test-git" --version)" = 'git version fixture'
          test "$(env -u CHRONO_AMBIENT_PROBE BOUND_FACTS_VALUE=declared CHRONO_TEST_GIT_PROFILE=registration \
            CHRONO_FACTS_TRACE="$RUNNER_TEMP/profile.trace" FACTS_GIT_MODE=pass \
            "$CARGO_TARGET_DIR/release/chrono-test-git-profile" --version)" = 'git version fixture'
          test "$(cat "$RUNNER_TEMP/profile.trace")" = '--version'
          mkdir "$RUNNER_TEMP/dist"
          for tool in chrono-test-git chrono-test-git-profile; do
            cp "$CARGO_TARGET_DIR/release/$tool" "$RUNNER_TEMP/dist/$tool-$PLATFORM"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Publish binaries and their checksums
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum chrono-test-git-{macos-aarch64,linux-x86_64} chrono-test-git-profile-{macos-aarch64,linux-x86_64} > SHA256SUMS
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            chrono-test-git-{macos-aarch64,linux-x86_64} chrono-test-git-profile-{macos-aarch64,linux-x86_64} SHA256SUMS
